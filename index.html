<style>
/* Layout: un catálogo de una sola página. Cabecera con cifras, filtros por plataforma,
   cuadrícula de fichas y una hoja con capturas al tocar cada app. */
:root {
  --bg: #eef0f3;
  --card: #ffffff;
  --ink: #14161b;
  --muted: #5d6470;
  --line: #d9dde3;
  --accent: #ff5a1f;
  --accent-ink: #ffffff;
  --shade: rgba(20, 22, 27, .55);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --card: #1b1e24; --ink: #eef0f3; --muted: #9aa1ac; --line: #2c3038;
    --accent: #ff7a45; --accent-ink: #111317; --shade: rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --card: #1b1e24; --ink: #eef0f3; --muted: #9aa1ac; --line: #2c3038;
  --accent: #ff7a45; --accent-ink: #111317; --shade: rgba(0, 0, 0, .7); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* Barra */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 20px; }
.who { font-weight: 600; font-size: 15px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: none; padding: 4px 11px; border-radius: 999px; cursor: pointer;
  font: 500 12px/1 var(--mono); letter-spacing: .06em; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Cabecera */
.head { padding-block: 40px 28px; }
h1 { font: 800 clamp(38px, 7.4vw, 80px)/.98 var(--display); letter-spacing: -.03em; margin: 0; text-wrap: balance; max-width: 16ch; }
h1 em { font-style: normal; color: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 32px; margin: 32px 0 0; padding: 0; list-style: none; }
.stats li { display: flex; flex-direction: column; }
.stats b { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats span { font: 400 12px/1.4 var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 6px; }

/* Filtros */
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 8px 20px; }
.filters button { border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 7px 14px; cursor: pointer; font-size: 14px; font-weight: 500; transition: border-color .15s; }
.filters button:hover { border-color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.filters small { font: 400 12px var(--mono); opacity: .7; margin-left: 4px; }

/* Cuadrícula */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px; }
.app { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; cursor: pointer;
  transition: transform .2s, border-color .2s; }
.app:hover { transform: translateY(-3px); border-color: var(--muted); }
.app:hover .icon { transform: rotate(-6deg) scale(1.04); }
.icon { width: 64px; height: 64px; border-radius: 22%; display: block; margin-bottom: 12px;
  box-shadow: 0 0 0 1px var(--line); transition: transform .25s; }
.app h2 { font: 700 21px/1.15 var(--display); margin: 0; letter-spacing: -.01em; }
.app p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.stack { font: 400 12px/1.5 var(--mono); color: var(--muted); padding-top: 8px; }
.flag { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.app.feature { border: 2px solid var(--accent); }
.app.feature h2 { font-size: 28px; }
@media (min-width: 760px) { .app.feature { grid-column: span 2; } }
.made { font: 400 12px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: -2px; }
.sheet .chips { margin: 0 0 20px; padding-top: 8px; }
a.copy { color: var(--ink); text-decoration: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 14px; }
.chips span { font: 400 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; color: var(--muted); }

/* Contacto y pie */
.contact { padding-block: 72px 24px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px; }
.contact h2 { font: 800 clamp(28px, 5vw, 44px)/1 var(--display); letter-spacing: -.02em; margin: 0; width: 100%; }
.mail { font-size: clamp(18px, 3vw, 22px); font-weight: 500; user-select: all; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.foot { text-align: center; color: var(--muted); font: 400 12px/1.5 var(--mono); padding-block: 32px 28px; margin: 0; }

/* Ficha */
dialog { border: 0; padding: 0; background: var(--card); color: var(--ink); border-radius: 24px;
  width: min(760px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; }
dialog.wide { width: min(980px, calc(100% - 24px)); }
dialog::backdrop { background: var(--shade); }
.sheet { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; padding: 28px; }
.sheet .icon { width: 72px; height: 72px; }
.kind { font: 400 12px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.sheet h2 { font: 800 34px/1.05 var(--display); letter-spacing: -.02em; margin: 4px 0 12px; }
.sheet p { margin: 0 0 20px; color: var(--muted); max-width: 42ch; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { text-decoration: none; color: var(--accent-ink); background: var(--accent); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.links a + a { background: none; color: var(--ink); border: 1px solid var(--line); }
.shots { display: flex; gap: 12px; align-items: flex-start; }
.shots img { width: 170px; height: auto; border-radius: 18px; border: 1px solid var(--line); display: block; }
.shots img:nth-child(2) { margin-top: 28px; }
/* Webs: capturas de escritorio, anchas y una bajo otra */
.sheet.wide { grid-template-columns: minmax(0, 1fr); }
.sheet.wide p { max-width: 60ch; }
.sheet.wide .shots { flex-direction: column; gap: 16px; }
.sheet.wide .shots img { width: 100%; border-radius: 12px; margin: 0; }
.sheet.wide .shots.phones { flex-direction: row; justify-content: center; }
.sheet.wide .shots.phones img { width: min(220px, calc(50% - 8px)); border-radius: 18px; }
.close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; line-height: 1; }
@media (max-width: 640px) {
  .app { display: grid; grid-template-columns: 56px minmax(0, 1fr); column-gap: 14px; row-gap: 2px; padding: 16px; }
  .app .icon { width: 56px; height: 56px; margin: 0; grid-row: span 5; }
  .app.feature h2 { font-size: 24px; }
  .app .chips { padding-top: 8px; }
  .sheet { grid-template-columns: minmax(0, 1fr); padding: 24px 20px; }
  .shots img { width: calc(50% - 6px); }
  .sheet.wide .shots img { width: 100%; }
  .sheet.wide .shots.phones img { width: calc(50% - 8px); }
}
@media (prefers-reduced-motion: reduce) {
  .app, .icon { transition: none; }
  .app:hover, .app:hover .icon { transform: none; }
}
</style>

const $ = (id) => document.getElementById(id);

  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const count = (pf) => pf === "all" ? PROFILE.projects.length : PROFILE.projects.filter((p) => p.platforms.includes(pf)).length;
const icon = (p) => p.icon || `img/icons/${p.id}.png`;

let lang = store.get("lang") === "en" ? "en" : "es";
let filter = "all";
let openId = null;

const ordered = () => [...PROFILE.projects].sort((a, b) =>
  (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || (a.featured ? 0 : b.since.localeCompare(a.since)));

function render() {
  const t = CONTENT[lang];
  document.documentElement.lang = lang;
  $("title").innerHTML = t.title;

  $("stats").innerHTML = ["all", "iphone", "android", "web"].map((k) =>

  $("grid").innerHTML = ordered()
    .filter((p) => filter === "all" || p.platforms.includes(filter))
    .map((p) => `<button type="button" class="app${p.featured ? " feature" : ""}" data-open="${p.id}">
      <img class="icon" src="${icon(p)}" alt="" width="64" height="64">
      ${p.featured ? `<span class="flag">${esc(t.featured)}</span>` : ""}
      <h2>${esc(p.name)}</h2>
      <p>${esc(p[lang].tag)}</p>
      <div class="chips">${p.platforms.map((pf) => `<span>${esc(t.chips[pf])}</span>`).join("")}</div>
      <div class="stack">${p.stack.map(esc).join(" · ")}</div>
    </button>`).join("");

  $("contactTitle").textContent = t.contactTitle;
  $("mail").textContent = PROFILE.email;
  $("copyBtn").textContent = t.copy;
  $("github").href = PROFILE.github;
  $("sheetClose").setAttribute("aria-label", t.close);
  $("foot").textContent = `© ${new Date().getFullYear()} · ${t.foot}`;
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (openId) fillSheet(openId);
}

function fillSheet(id) {
  const p = PROFILE.projects.find((x) => x.id === id);
  if (!p) return false;
  const t = CONTENT[lang];
  const kind = [...p.platforms.map((pf) => t.chips[pf]), p.since.slice(0, 4)].join(" · ");
  $("sheetBody").className = p.wide ? "sheet wide" : "sheet";
  $("sheet").classList.toggle("wide", !!p.wide);
  $("sheetBody").innerHTML = `<div>
      <img class="icon" src="${icon(p)}" alt="" width="72" height="72">
      <div class="kind">${esc(kind)}</div>
      <h2>${esc(p.name)}</h2>
      <p>${esc(p[lang].desc)}</p>
      <div class="made">${esc(t.madeWith)}</div>
      <div class="chips">${p.stack.map((s) => `<span>${esc(s)}</span>`).join("")}</div>
      ${p.links.length ? `<div class="links">${p.links.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || t[l.type])} ↗</a>`).join("")}</div>` : ""}
    </div>
    <div class="shots">${p.imgs.map((src, i) =>
      `<img src="${esc(src)}" alt="${esc(p.name)} ${i + 1}" ${p.wide ? 'width="1280" height="800"' : 'width="540" height="1170"'} decoding="async">`).join("")}</div>${p.phones ? `<div class="shots phones">${p.phones.map((src, i) =>
      `<img src="${esc(src)}" alt="${esc(p.name)} iPhone ${i + 1}" width="540" height="1170" decoding="async">`).join("")}</div>` : ""}`;
  return true;
}

function openSheet(id) {
  if (!fillSheet(id)) return;
  openId = id;
  try { $("sheet").showModal(); } catch { $("sheet").setAttribute("open", ""); }
  try { history.replaceState(null, "", `#${id}`); } catch {}
}

/* Eventos */
$("grid").addEventListener("click", (e) => {
  const b = e.target.closest("[data-open]"); if (b) openSheet(b.dataset.open);
});
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]"); if (!b) return;
  filter = b.dataset.filter; render();
});
$("sheetClose").addEventListener("click", () => $("sheet").close());
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").close(); });
$("sheet").addEventListener("close", () => {
  openId = null;
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
});
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang; store.set("lang", lang); render();
}));
$("copyBtn").addEventListener("click", () => {
  const done = () => { $("copyBtn").textContent = CONTENT[lang].copied; setTimeout(() => { $("copyBtn").textContent = CONTENT[lang].copy; }, 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(PROFILE.email).then(done, fallback); } catch { fallback(); }
});

/* Precarga de capturas: al pasar sobre una tarjeta y, después, todas en segundo plano */
const loaded = new Set();
const preload = (p) => p && [...p.imgs, ...(p.phones || [])].forEach((src) => { if (!loaded.has(src)) { loaded.add(src); new Image().src = src; } });
$("grid").addEventListener("pointerover", (e) => {
  const b = e.target.closest("[data-open]"); if (b) preload(PROFILE.projects.find((x) => x.id === b.dataset.open));
});
window.addEventListener("load", () => {
  const all = () => PROFILE.projects.forEach(preload);
  "requestIdleCallback" in window ? requestIdleCallback(all, { timeout: 3000 }) : setTimeout(all, 1500);
});

window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && id !== openId) openSheet(id);
});

render();
if (location.hash.length > 1) openSheet(location.hash.slice(1));
</script>
