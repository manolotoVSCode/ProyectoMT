<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyecto Personal MT</title>
<meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: un catálogo de una sola página. Cabecera con cifras, filtros por plataforma,
   cuadrícula de fichas y una hoja con capturas al tocar cada app. */
:root {
  --bg: #eef0f3;
  --card: #ffffff;
  --ink: #14161b;
  --muted: #5d6470;
  --line: #d9dde3;
  --accent: #ff5a1f;
  --accent-ink: #ffffff;
  --shade: rgba(20, 22, 27, .55);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --card: #1b1e24; --ink: #eef0f3; --muted: #9aa1ac; --line: #2c3038;
    --accent: #ff7a45; --accent-ink: #111317; --shade: rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --card: #1b1e24; --ink: #eef0f3; --muted: #9aa1ac; --line: #2c3038;
  --accent: #ff7a45; --accent-ink: #111317; --shade: rgba(0, 0, 0, .7); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* Barra */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 20px; }
.who { font-weight: 600; font-size: 15px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: none; padding: 4px 11px; border-radius: 999px; cursor: pointer;
  font: 500 12px/1 var(--mono); letter-spacing: .06em; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Cabecera */
.head { padding-block: 40px 28px; }
h1 { font: 800 clamp(38px, 7.4vw, 80px)/.98 var(--display); letter-spacing: -.03em; margin: 0; text-wrap: balance; max-width: 16ch; }
h1 em { font-style: normal; color: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 32px; margin: 32px 0 0; padding: 0; list-style: none; }
.stats li { display: flex; flex-direction: column; }
.stats b { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats span { font: 400 12px/1.4 var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 6px; }

/* Filtros */
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 8px 20px; }
.filters button { border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 7px 14px; cursor: pointer; font-size: 14px; font-weight: 500; transition: border-color .15s; }
.filters button:hover { border-color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.filters small { font: 400 12px var(--mono); opacity: .7; margin-left: 4px; }

/* Cuadrícula */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px; }
.app { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; cursor: pointer;
  transition: transform .2s, border-color .2s; }
.app:hover { transform: translateY(-3px); border-color: var(--muted); }
.app:hover .icon { transform: rotate(-6deg) scale(1.04); }
.icon { width: 64px; height: 64px; border-radius: 22%; display: block; margin-bottom: 12px;
  box-shadow: 0 0 0 1px var(--line); transition: transform .25s; }
.app h2 { font: 700 21px/1.15 var(--display); margin: 0; letter-spacing: -.01em; }
.app p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 14px; }
.chips span { font: 400 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; color: var(--muted); }

/* Contacto y pie */
.contact { padding-block: 72px 24px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px; }
.contact h2 { font: 800 clamp(28px, 5vw, 44px)/1 var(--display); letter-spacing: -.02em; margin: 0; width: 100%; }
.mail { font-size: clamp(18px, 3vw, 22px); font-weight: 500; user-select: all; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.foot { text-align: center; color: var(--muted); font: 400 12px/1.5 var(--mono); padding-block: 32px 28px; margin: 0; }

/* Ficha */
dialog { border: 0; padding: 0; background: var(--card); color: var(--ink); border-radius: 24px;
  width: min(760px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; }
dialog::backdrop { background: var(--shade); }
.sheet { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; padding: 28px; }
.sheet .icon { width: 72px; height: 72px; }
.kind { font: 400 12px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.sheet h2 { font: 800 34px/1.05 var(--display); letter-spacing: -.02em; margin: 4px 0 12px; }
.sheet p { margin: 0 0 20px; color: var(--muted); max-width: 42ch; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { text-decoration: none; color: var(--accent-ink); background: var(--accent); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.links a + a { background: none; color: var(--ink); border: 1px solid var(--line); }
.shots { display: flex; gap: 12px; align-items: flex-start; }
.shots img { width: 170px; height: auto; border-radius: 18px; border: 1px solid var(--line); display: block; }
.shots img:nth-child(2) { margin-top: 28px; }
.close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; line-height: 1; }
@media (max-width: 640px) {
  .app { display: grid; grid-template-columns: 56px minmax(0, 1fr); column-gap: 14px; row-gap: 2px; padding: 16px; }
  .app .icon { width: 56px; height: 56px; margin: 0; grid-row: span 3; }
  .app .chips { padding-top: 8px; }
  .sheet { grid-template-columns: minmax(0, 1fr); padding: 24px 20px; }
  .shots img { width: calc(50% - 6px); }
}
@media (prefers-reduced-motion: reduce) {
  .app, .icon { transition: none; }
  .app:hover, .app:hover .icon { transform: none; }
}
</style>

<div class="wrap">
  <header class="bar">
    <span class="who">Manuel de la Torre</span>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" id="lang-es" data-lang="es">ES</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <section class="head">
      <h1 id="title"></h1>
      <ul class="stats" id="stats"></ul>
    </section>
    <div class="filters" id="filters" role="group"></div>
    <div class="grid" id="grid"></div>

    <section class="contact" id="contacto">
      <h2 id="contactTitle"></h2>
      <span class="mail" id="mail"></span>
      <button type="button" class="copy" id="copyBtn"></button>
    </section>
  </main>
  <p class="foot" id="foot"></p>
</div>

<dialog id="sheet">
  <button type="button" class="close" id="sheetClose" aria-label="Cerrar">×</button>
  <div class="sheet" id="sheetBody"></div>
</dialog>

<script>
/* ================================================================
   EDITA AQUÍ TU INFORMACIÓN
   - PROFILE: datos que no cambian con el idioma
   - CONTENT: textos en español (es) e inglés (en)
   ================================================================ */
const PROFILE = {
  email: "contacto@manoloto.com",
  // platforms: "iphone", "android" o "web" (alimentan los filtros y las cifras)
  // links: "web" o "store"; si falta el de la App Store, se deja vacío
  projects: [
    { id: "savium-finanzas", name: "Savium Finanzas", platforms: ["iphone", "web"],
      imgs: ["img/savium-finanzas-1.jpg", "img/savium-finanzas-2.jpg"],
      links: [{ type: "store", url: "https://apps.apple.com/app/id6820799492" }, { type: "web", url: "https://savium.manoloto.com" }],
      es: { tag: "Tus finanzas personales en un solo lugar.", desc: "Mis finanzas personales en un solo lugar: cuentas, inversiones, cripto, suscripciones y extractos bancarios." },
      en: { tag: "Your personal finances in one place.", desc: "Personal finance in one place: accounts, investments, crypto, subscriptions and bank statements." } },
    { id: "savium-share", name: "Savium Share", platforms: ["iphone", "android"],
      imgs: ["img/savium-share-1.jpg", "img/savium-share-2.jpg"],
      links: [{ type: "store", url: "https://apps.apple.com/app/id6822409433" }],
      es: { tag: "Divide gastos gratis y sin registrarte.", desc: "Divide gastos con amigos, familia o en viajes. Gratis, sin registrarte y sin límite de gastos ni de grupos. Varias divisas, saldar cuentas con los mínimos pagos y funciona sin conexión." },
      en: { tag: "Split expenses, free and with no sign-up.", desc: "Split expenses with friends, family or on trips. Free, no sign-up and no limits on expenses or groups. Multiple currencies, settle up in the fewest payments, and it works offline." } },
    { id: "savium-rewards", name: "Savium Rewards", platforms: ["iphone"],
      imgs: ["img/savium-rewards-1.jpg", "img/savium-rewards-2.jpg"],
      links: [], // falta el enlace de la App Store
      es: { tag: "Las tarjetas de lealtad de toda la familia.", desc: "La cartera familiar de tarjetas de lealtad: puntos, millas y monederos con el código listo en caja." },
      en: { tag: "The whole family's loyalty cards.", desc: "A family wallet for loyalty cards: points, miles and store credit with the barcode ready at checkout." } },
    { id: "piggy-bank", name: "Piggy Bank", platforms: ["iphone"],
      imgs: ["img/piggy-bank-1.jpg", "img/piggy-bank-2.jpg"],
      links: [], // falta el enlace de la App Store
      es: { tag: "Una alcancía para que los niños aprendan a ahorrar.", desc: "La alcancía digital para enseñar a los hijos a manejar dinero: tres frascos, domingo automático, tareas y metas." },
      en: { tag: "A piggy bank that teaches kids to save.", desc: "A digital piggy bank that teaches kids about money: three jars, automatic allowance, chores and goals." } },
    { id: "savium-corporate", name: "Savium Corporate", platforms: ["web"],
      imgs: ["img/savium-corporate-1.jpg", "img/savium-corporate-2.jpg"],
      links: [{ type: "web", url: "https://saviumcorporate.manoloto.com" }],
      es: { tag: "Las finanzas de una PyME, sin contabilidad.", desc: "Gestión financiera para PyMEs mexicanas: estado de resultados, balance, flujo de caja e índices financieros con semáforos, sin saber de contabilidad." },
      en: { tag: "Small-business finances, no accounting needed.", desc: "Financial management for Mexican small businesses: income statement, balance sheet, cash flow and financial ratios with traffic lights, no accounting knowledge needed." } },
    { id: "savium-condo", name: "Savium Condo", platforms: ["web"],
      imgs: ["img/savium-condo-1.jpg", "img/savium-condo-2.jpg"],
      links: [], // sin web pública todavía
      es: { tag: "La administración de un condominio.", desc: "Administración de condominios: cuotas y pagos de cada propietario, gastos y proveedores, fondos, morosidad por unidad e informes del mes." },
      en: { tag: "Running a condominium.", desc: "Condominium management: each owner's fees and payments, expenses and suppliers, funds, overdue units and monthly reports." } },
    { id: "chp-app", name: "CHP App", platforms: ["iphone"],
      imgs: ["img/chp-app-1.jpg", "img/chp-app-2.jpg"],
      links: [{ type: "web", url: "https://app.chpmex.com" }], // falta el enlace de la App Store
      es: { tag: "Facturas de energía y ahorro por cogeneración.", desc: "Analiza facturas de luz y gas y calcula el ahorro y EBITDA de un proyecto de cogeneración." },
      en: { tag: "Energy bills and cogeneration savings.", desc: "Reads power and gas bills and calculates the savings and EBITDA of a cogeneration project." } },
    { id: "chp-panel", name: "CHP Panel de Control", platforms: ["iphone", "web"],
      imgs: ["img/chp-panel-1.jpg", "img/chp-panel-2.jpg"],
      links: [{ type: "store", url: "https://apps.apple.com/us/app/chp-app-panel-de-control/id6819522675" }, { type: "web", url: "https://app.chpmex.com" }],
      es: { tag: "La consola del equipo de CHP.", desc: "El panel del equipo de CHP: salud de la plataforma, accesos, pendientes y aprobaciones desde el iPhone." },
      en: { tag: "CHP's team console.", desc: "CHP's team console: platform health, access, pending work and approvals from the iPhone." } },
    { id: "chpmex", name: "CHPMex.com", platforms: ["web"],
      imgs: ["img/chpmex-1.jpg", "img/chpmex-2.jpg"],
      links: [{ type: "web", url: "https://chpmex.com" }],
      es: { tag: "Cogeneración para la industria.", desc: "El sitio de CHP México: cogeneración y eficiencia energética para la industria." },
      en: { tag: "Cogeneration for industry.", desc: "CHP México's website: cogeneration and energy efficiency for industry." } },
    { id: "tortracs", name: "Tortracs.net", platforms: ["web"], icon: "img/icons/tortracs.svg",
      imgs: ["img/tortracs-1.jpg", "img/tortracs-2.jpg"],
      links: [{ type: "web", url: "https://tortracs.net" }],
      es: { tag: "Transporte de carga por México.", desc: "El sitio de TORTRACS, empresa de transporte terrestre de carga en México: servicio dedicado, carga consolidada, viajes spot y rastreo GPS." },
      en: { tag: "Freight trucking across Mexico.", desc: "The website of TORTRACS, a freight trucking company in Mexico: dedicated service, consolidated loads, spot trips and GPS tracking." } },
    { id: "little-galaxy", name: "Little Galaxy", platforms: ["iphone", "web"],
      imgs: ["img/little-galaxy-1.jpg", "img/little-galaxy-2.jpg"],
      links: [{ type: "store", url: "https://apps.apple.com/app/id6760791741" }, { type: "web", url: "https://littlegalaxy.org" }],
      es: { tag: "Un patio de juegos espacial para peques.", desc: "Un patio de juegos espacial y gratuito para niños pequeños: tocan para crear planetas, estrellas fugaces y constelaciones." },
      en: { tag: "A space playground for toddlers.", desc: "A free space playground for toddlers: tap to create planets, shooting stars and constellations." } },
  ],
};

const CONTENT = {
  es: {
    title: "Apps y webs que hago en mi <em>tiempo libre</em>.",
    stats: { all: "proyectos", iphone: "apps de iPhone", web: "sitios web" },
    filters: { all: "Todo", iphone: "iPhone", android: "Android", web: "Web" },
    chips: { iphone: "iPhone", android: "Android", web: "Web" },
    filterLabel: "Filtrar por plataforma",
    web: "Abrir web", store: "App Store",
    contactTitle: "Escríbeme",
    copy: "Copiar correo", copied: "Copiado", close: "Cerrar",
    foot: "Proyecto personal de Manuel de la Torre (MT)",
  },
  en: {
    title: "Apps and sites I make in my <em>free time</em>.",
    stats: { all: "projects", iphone: "iPhone apps", web: "websites" },
    filters: { all: "All", iphone: "iPhone", android: "Android", web: "Web" },
    chips: { iphone: "iPhone", android: "Android", web: "Web" },
    filterLabel: "Filter by platform",
    web: "Open site", store: "App Store",
    contactTitle: "Write to me",
    copy: "Copy email", copied: "Copied", close: "Close",
    foot: "Personal project by Manuel de la Torre (MT)",
  },
};
/* ================================================================ */

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const count = (pf) => pf === "all" ? PROFILE.projects.length : PROFILE.projects.filter((p) => p.platforms.includes(pf)).length;
const icon = (p) => p.icon || `img/icons/${p.id}.png`;

let lang = store.get("lang") === "en" ? "en" : "es";
let filter = "all";
let openId = null;

function render() {
  const t = CONTENT[lang];
  document.documentElement.lang = lang;
  $("title").innerHTML = t.title;

  $("stats").innerHTML = ["all", "iphone", "web"].map((k) =>
    `<li><b>${count(k)}</b><span>${esc(t.stats[k])}</span></li>`).join("");

  $("filters").setAttribute("aria-label", t.filterLabel);
  $("filters").innerHTML = ["all", "iphone", "android", "web"].map((k) =>
    `<button type="button" id="filter-${k}" data-filter="${k}" aria-pressed="${k === filter}">${esc(t.filters[k])}<small>${count(k)}</small></button>`).join("");

  $("grid").innerHTML = PROFILE.projects
    .filter((p) => filter === "all" || p.platforms.includes(filter))
    .map((p) => `<button type="button" class="app" data-open="${p.id}">
      <img class="icon" src="${icon(p)}" alt="" width="64" height="64">
      <h2>${esc(p.name)}</h2>
      <p>${esc(p[lang].tag)}</p>
      <div class="chips">${p.platforms.map((pf) => `<span>${esc(t.chips[pf])}</span>`).join("")}</div>
    </button>`).join("");

  $("contactTitle").textContent = t.contactTitle;
  $("mail").textContent = PROFILE.email;
  $("copyBtn").textContent = t.copy;
  $("sheetClose").setAttribute("aria-label", t.close);
  $("foot").textContent = `© ${new Date().getFullYear()} · ${t.foot}`;
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (openId) fillSheet(openId);
}

function fillSheet(id) {
  const p = PROFILE.projects.find((x) => x.id === id);
  if (!p) return false;
  const t = CONTENT[lang];
  const kind = p.platforms.map((pf) => t.chips[pf]).join(" · ");
  $("sheetBody").innerHTML = `<div>
      <img class="icon" src="${icon(p)}" alt="" width="72" height="72">
      <div class="kind">${esc(kind)}</div>
      <h2>${esc(p.name)}</h2>
      <p>${esc(p[lang].desc)}</p>
      ${p.links.length ? `<div class="links">${p.links.map((l) =>
        `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(t[l.type])} ↗</a>`).join("")}</div>` : ""}
    </div>
    <div class="shots">${p.imgs.map((src, i) =>
      `<img src="${esc(src)}" alt="${esc(p.name)} ${i + 1}" width="540" height="1170" loading="lazy">`).join("")}</div>`;
  return true;
}

function openSheet(id) {
  if (!fillSheet(id)) return;
  openId = id;
  try { $("sheet").showModal(); } catch { $("sheet").setAttribute("open", ""); }
  try { history.replaceState(null, "", `#${id}`); } catch {}
}

/* Eventos */
$("grid").addEventListener("click", (e) => {
  const b = e.target.closest("[data-open]"); if (b) openSheet(b.dataset.open);
});
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("[data-filter]"); if (!b) return;
  filter = b.dataset.filter; render();
});
$("sheetClose").addEventListener("click", () => $("sheet").close());
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").close(); });
$("sheet").addEventListener("close", () => {
  openId = null;
  try { history.replaceState(null, "", location.pathname + location.search); } catch {}
});
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang; store.set("lang", lang); render();
}));
$("copyBtn").addEventListener("click", () => {
  const done = () => { $("copyBtn").textContent = CONTENT[lang].copied; setTimeout(() => { $("copyBtn").textContent = CONTENT[lang].copy; }, 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(PROFILE.email).then(done, fallback); } catch { fallback(); }
});

window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && id !== openId) openSheet(id);
});

render();
if (location.hash.length > 1) openSheet(location.hash.slice(1));
</script>
